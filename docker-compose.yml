services:
  postgres:
    image: postgres:16
    container_name: auth-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass_dev
      POSTGRES_DB: auth_api
    ports:
      - "5432:5432"
    volumes:
      - auth_api_pgdata:/var/lib/postgresql/data

volumes:
  auth_api_pgdata:
